<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead List Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/portal.css">
  <script src="/static/create_prefill.js"></script>
</head>
<body>
<div class="wrap">
  <div class="appnav" aria-label="App navigation">
    <a href="/dashboard" class="brand brand-title">Lead List Ledger</a>
    <div class="nav-btns">
      <a href="/dashboard" class="here">Overview</a>
    </div>
  </div>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <header class="masthead">
    <p class="eyebrow" id="eyebrow"></p>
    <div class="h1row">
      <h1 id="page-title"></h1>
      <div class="header-actions" id="header-actions"></div>
    </div>
    <p class="sub" id="page-sub"></p>
    <p class="brand-mark" id="brand-mark" hidden>LEAD GENERATION</p>
  </header>
  <main id="view"></main>
  <footer>
    <p>Built from <code>data/clients/*/campaigns/</code> cost logs (legacy
    <code>data/campaigns/</code> junctions), stage CSVs, and ICP library
    folders. Clients sync on every load; use <b>Refresh costs</b> for a full
    spend rescan. Create a client via <b>New client</b> (PDF/URL).</p>
    <p id="stamp"></p>
  </footer>
</div>

<script id="ledger-data" type="application/json">__DATA__</script>
<script>
(function () {
  const VENDORS = ['apify', 'apollo', 'firecrawl', 'llm'];
  const VENDOR_LABEL = { apify: 'Apify', apollo: 'Apollo', firecrawl: 'Firecrawl', llm: 'LLM (est)' };
  const BASIS_LABEL = {
    apify_api: 'Apify API usage',
    apollo_credits: 'Apollo credits consumed',
    apollo_credit_estimate: 'Apollo credits, modelled',
    firecrawl_plan_credits: 'Firecrawl plan credits',
    firecrawl_flat_rate_est: 'Firecrawl pages x rate',
    llm_flat_rate_est: 'Tokens x rate',
    legacy_cost_log: 'Pre-v4 cost log'
  };
  const STAGES = [
    ['seeds', 'Raw seeds'],
    ['icp_matched', 'ICP matched'],
    ['deduped', 'Deduped'],
    ['contactable', 'Apollo contactable'],
    ['enriched', 'Enriched'],
    ['scored', 'Scored']
  ];
  function outreachLabel(ctype) { return ctype === 'talent_search' ? 'talent outreach' : 'company outreach'; }
  function targetingLabel(ctype) { return ctype === 'talent_search' ? 'ITP' : 'ICP'; }
  const TYPE_LABEL = { company_outreach: 'company outreach', talent_search: 'talent outreach' };
  const LEAD_COLS = [
    'company_name',
    'decision_maker_name',
    'decision_maker_title',
    'decision_maker_email',
    'decision_maker_linkedin',
    'lead_score',
    'run_id'
  ];

  const usd = (n) => '$' + (Number(n) || 0).toFixed(2);
  const usd4 = (n) => '$' + (Number(n) || 0).toFixed(4);
  const int = (n) => (Number(n) || 0).toLocaleString('en-US');
  const pct = (a, b) => (b ? (a / b * 100).toFixed(0) + '%' : '--');

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  let DATA = { campaigns: [], runs: [], by_client: {}, totals: {}, scope: { kind: 'all', id: null } };

  function campaignById(id) { return (DATA.campaigns || []).find((c) => c.campaign_id === id); }
  function clientById(id) { return (DATA.by_client || {})[id]; }
  function campaignsOfClient(id) { return (DATA.campaigns || []).filter((c) => c.client_id === id); }

  /** Executed lists + gated runs in progress / awaiting approval. */
  function isGeneratedList(c) {
    if (!c) return false;
    if (c.cost_basis && c.cost_basis !== 'none') return true;
    if (Number(c.usd_total) > 0) return true;
    if (Number(c.delivered_leads) > 0) return true;
    const counts = c.lead_counts || {};
    if (['seeds', 'icp_matched', 'deduped', 'contactable', 'enriched', 'scored']
      .some((k) => Number(counts[k]) > 0)) return true;
    const phase = c.list_run_phase || '';
    if (['seeding', 'matching', 'smoking', 'awaiting_approval', 'running_full', 'completed', 'error']
      .indexOf(phase) >= 0) return true;
    return false;
  }

  function listRunBadge(c) {
    const phase = (c && c.list_run_phase) || '';
    const build = (c && c.list_build_status) || '';
    if (['seeding', 'matching', 'smoking', 'running_full'].indexOf(phase) >= 0) {
      return { cls: 'ctype ts', text: 'in progress' };
    }
    if (phase === 'awaiting_approval') {
      return { cls: 'ctype ts', text: 'awaiting approval' };
    }
    if (phase === 'error') {
      return { cls: 'ctype ts', text: 'run error' };
    }
    if (build === 'deferred') {
      return { cls: 'ctype co', text: 'saved for later' };
    }
    return null;
  }

  function generatedLists(campaigns) {
    return (campaigns || []).filter(isGeneratedList);
  }
  function runsOf(pred) { return (DATA.runs || []).filter(pred); }

  function campaignTypeOf(c) {
    return (c && (c.campaign_type || (c.plan && c.plan.campaign_type))) || 'company_outreach';
  }

  function runCampaignType(r) {
    if (r && r.campaign_type) return r.campaign_type;
    const c = campaignById(r && r.campaign_id);
    return campaignTypeOf(c);
  }

  function runKeyOf(r) {
    return (r && (r.run_key || r.pipeline_run_id || r.label)) || '';
  }

  function findRun(campaignId, runKey) {
    const key = String(runKey || '');
    return (DATA.runs || []).find((r) =>
      r.campaign_id === campaignId && runKeyOf(r) === key
    );
  }

  /* ---------------- shared builders ---------------- */

  function tiles(items) {
    const box = el('section', 'tiles');
    items.forEach((t) => {
      const tile = el('div', 'tile');
      tile.append(el('span', 'label', t.label));
      tile.append(el('span', 'value' + (t.lead ? ' lead' : ''), t.value));
      tile.append(el('span', 'foot', t.foot || ''));
      box.append(tile);
    });
    return box;
  }

  function section(title, note, body) {
    const sec = el('section', 'section');
    const head = el('div', 'section-head');
    head.append(el('h2', null, title));
    if (note) head.append(el('p', 'note', note));
    sec.append(head);
    if (body) sec.append(body);
    return sec;
  }

  function vendorAmounts(sources) {
    const totals = {};
    Object.entries(sources || {}).forEach(([key, d]) => {
      const vendor = (d && d.source) || key;
      totals[vendor] = (totals[vendor] || 0) + (Number(d && d.usd) || 0);
    });
    return VENDORS.map((v) => totals[v] || 0);
  }

  function splitBar(sources, tall, emptyText) {
    const split = el('div', 'split');
    const amounts = vendorAmounts(sources);
    const total = amounts.reduce((a, b) => a + b, 0);
    if (total <= 0) {
      split.append(el('div', 'legend', emptyText || 'No spend recorded for this list.'));
      return split;
    }
    const bar = el('div', 'split-bar' + (tall ? ' tall' : ''));
    VENDORS.forEach((v, i) => {
      if (!amounts[i]) return;
      const seg = el('span', 'seg-' + v);
      seg.style.width = (amounts[i] / total * 100) + '%';
      seg.title = VENDOR_LABEL[v] + ' ' + usd4(amounts[i]);
      bar.append(seg);
    });
    split.append(bar);
    const legend = el('div', 'legend');
    VENDORS.forEach((v, i) => {
      if (!amounts[i]) return;
      const item = el('span');
      const dot = el('span', 'dot');
      dot.style.background = 'var(--' + v + ')';
      item.append(dot, document.createTextNode(VENDOR_LABEL[v] + ' '));
      item.append(el('b', null, usd4(amounts[i])));
      legend.append(item);
    });
    split.append(legend);
    return split;
  }

  function basisChipFor(c) {
    if (c.cost_basis === 'cost_runs') return ['chip tracked', 'tracked'];
    if (c.cost_basis === 'legacy_cost_log') return ['chip legacy', 'legacy log'];
    if (c.cost_basis === 'error') return ['chip error', 'build failed'];
    return ['chip', 'no cost data'];
  }

  function listRow(c, linked) {
    const counts = c.lead_counts || {};
    const tag = linked ? 'a' : 'div';
    const row = el(tag, 'list-row' + (c.cost_basis === 'none' ? ' untracked' : ''));
    if (linked) row.href = '#/campaign/' + encodeURIComponent(c.campaign_id);

    const id = el('div', 'id-cell');
    id.append(el('span', 'name', c.campaign_id));
    const meta = el('div', 'meta');
    meta.append(el('span', null, c.client_name || c.client_id || 'unknown client'));
    const ctype = campaignTypeOf(c);
    meta.append(el('span', 'ctype ' + (ctype === 'talent_search' ? 'ts' : 'co'),
      TYPE_LABEL[ctype] || outreachLabel(ctype)));
    const runBadge = listRunBadge(c);
    if (runBadge) meta.append(el('span', runBadge.cls, runBadge.text));
    const chip = basisChipFor(c);
    meta.append(el('span', chip[0], chip[1]));
    if (c.error) meta.append(el('span', null, c.error));
    id.append(meta);
    row.append(id);

    const funnel = el('div', 'funnel');
    const bars = el('div', 'funnel-bars');
    const steps = [counts.seeds || 0, counts.icp_matched || 0, c.delivered_leads || 0];
    const peak = Math.max.apply(null, steps.concat([1]));
    steps.forEach((v, i) => {
      const bar = el('div', 'funnel-bar' + (i ? ' s' + (i + 1) : ''));
      bar.style.width = Math.max(2, Math.round((v / peak) * 100)) + '%';
      bar.title = ['seeds', 'ICP matched', 'contactable'][i] + ': ' + int(v);
      bars.append(bar);
    });
    funnel.append(bars);
    funnel.append(el('span', 'caption', steps.map(int).join('  →  ')));
    row.append(funnel);
    row.append(splitBar(c.by_source));

    const money = el('div', 'money');
    if (c.usd_total) {
      money.append(el('span', 'total', usd(c.usd_total)));
      money.append(el('span', 'per', c.per_lead_usd ? usd4(c.per_lead_usd) + ' / lead' : 'no leads'));
    } else {
      money.append(el('span', 'none', c.cost_basis === 'error' ? 'unknown' : 'untracked'));
      money.append(el('span', 'per', int(c.delivered_leads) + ' leads'));
    }
    row.append(money);
    return row;
  }

  function listPanel(campaigns, linked) {
    const panel = el('div', 'panel');
    if (!campaigns.length) {
      panel.append(el('div', 'empty', 'No executed lists yet. Run a campaign to see it here.'));
      return panel;
    }
    campaigns.forEach((c) => panel.append(listRow(c, linked)));
    return panel;
  }

  function vendorTable(campaigns) {
    const totals = {};
    const bases = {};
    campaigns.forEach((c) => {
      Object.entries(c.by_source || {}).forEach(([name, d]) => {
        totals[name] = (totals[name] || 0) + (Number(d.usd) || 0);
        if (d.basis) (bases[name] = bases[name] || new Set()).add(d.basis);
      });
    });
    const grand = Object.values(totals).reduce((a, b) => a + b, 0);

    const panel = el('div', 'panel table-scroll');
    if (!grand) {
      panel.append(el('div', 'empty', 'No vendor spend recorded in this scope.'));
      return panel;
    }
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    ['Vendor', 'USD', 'Share', 'Basis'].forEach((h, i) => {
      hr.append(el('th', i === 1 || i === 2 ? 'r' : null, h));
    });
    thead.append(hr);
    table.append(thead);

    const tbody = document.createElement('tbody');
    Object.entries(totals).sort((a, b) => b[1] - a[1]).forEach(([name, amount]) => {
      const tr = document.createElement('tr');
      const label = document.createElement('td');
      const dot = el('span', 'dot');
      dot.style.background = 'var(--' + name + ', var(--ink-3))';
      label.append(dot, document.createTextNode(VENDOR_LABEL[name] || name));
      tr.append(label);
      tr.append(el('td', 'r', usd4(amount)));
      tr.append(el('td', 'r', grand ? (amount / grand * 100).toFixed(1) + '%' : '--'));
      tr.append(el('td', null,
        Array.from(bases[name] || []).map((b) => BASIS_LABEL[b] || b).join(' · ') || '--'));
      tbody.append(tr);
    });
    table.append(tbody);
    panel.append(table);
    return panel;
  }

  function clientTable() {
    const panel = el('div', 'panel table-scroll');
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    ['Client', 'Campaigns', 'USD', 'Leads', 'USD / lead'].forEach((h, i) => {
      hr.append(el('th', i > 0 ? 'r' : null, h));
    });
    thead.append(hr);
    table.append(thead);
    const tbody = document.createElement('tbody');
    const clients = Object.values(DATA.by_client || {});
    if (!clients.length) {
      panel.append(el('div', 'empty', 'No clients in the cost index yet.'));
      return panel;
    }
    clients
      .sort((a, b) => (b.usd_total || 0) - (a.usd_total || 0))
      .forEach((b) => {
        const tr = el('tr', 'clickable');
        tr.tabIndex = 0;
        const go = () => {
          const next = { kind: 'client', id: b.client_id };
          if (routeResolves(next)) navigate(next, false);
        };
        tr.addEventListener('click', (e) => { if (!(e.target.closest && e.target.closest('a'))) go(); });
        tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
        const name = document.createElement('td');
        const link = el('a', null, b.client_name || b.client_id);
        link.href = '#/client/' + encodeURIComponent(b.client_id);
        name.append(link);
        tr.append(name);
        tr.append(el('td', 'r', int((b.campaign_ids || []).length)));
        tr.append(el('td', 'r', usd4(b.usd_total)));
        tr.append(el('td', 'r', int(b.contactable_leads)));
        tr.append(el('td', 'r', b.per_lead_usd ? usd4(b.per_lead_usd) : '--'));
        tbody.append(tr);
      });
    table.append(tbody);
    panel.append(table);
    return panel;
  }

  function ledger(runs, opts) {
    opts = opts || {};
    const holder = el('div');
    const controls = el('div', 'filters');
    const made = {};

    function makeSelect(key, label, values, getValue) {
      const vals = values || Array.from(new Set(runs.map((r) => (getValue ? getValue(r) : r[key])).filter(Boolean))).sort();
      if (vals.length < 1 && key !== 'campaign_type') return null;
      if (vals.length < 2 && key !== 'campaign_type') return null;
      const wrap = el('label', null, label);
      const sel = document.createElement('select');
      sel.append(new Option('All', ''));
      vals.forEach((v) => sel.append(new Option(TYPE_LABEL[v] || String(v).replace(/_/g, ' '), v)));
      wrap.append(sel);
      controls.append(wrap);
      made[key] = { sel: sel, getValue: getValue || ((r) => r[key]) };
      return sel;
    }
    function makeDate(id, label) {
      const wrap = el('label', null, label);
      const input = document.createElement('input');
      input.type = 'date';
      wrap.append(input);
      controls.append(wrap);
      made[id] = { sel: input, getValue: null };
      return input;
    }

    if (opts.filters !== false) {
      makeSelect('client_id', 'Client');
      makeSelect('campaign_id', 'Campaign');
      makeSelect('campaign_type', 'Type', ['company_outreach', 'talent_search'], runCampaignType);
      if (runs.length > 1) { makeDate('from', 'From'); makeDate('to', 'To'); }
      if (controls.children.length) holder.append(controls);
    }

    const panel = el('div', 'panel table-scroll');
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    ['Date', 'List', 'Type', 'Run', 'Step', 'USD', 'Vendors'].forEach((h) => {
      hr.append(el('th', h === 'USD' ? 'r' : null, h));
    });
    thead.append(hr);
    table.append(thead);

    const tbody = document.createElement('tbody');
    runs.forEach((r) => {
      const tr = document.createElement('tr');
      tr.append(el('td', 'mono', r.run_date || '--'));

      const listCell = document.createElement('td');
      if (opts.linkList !== false) {
        const link = el('a', 'mono', r.campaign_id || '');
        link.href = '#/campaign/' + encodeURIComponent(r.campaign_id || '');
        listCell.append(link);
      } else {
        listCell.className = 'mono';
        listCell.textContent = r.campaign_id || '';
      }
      tr.append(listCell);

      const ctype = runCampaignType(r);
      tr.append(el('td', null, TYPE_LABEL[ctype] || ctype.replace(/_/g, ' ')));
      tr.append(el('td', null, r.label || r.run_key || ''));
      tr.append(el('td', null, (r.workflow_step || '').replace(/_/g, ' ')));
      tr.append(el('td', 'r', usd4(r.total_usd)));

      const vendors = document.createElement('td');
      const seen = {};
      Object.values(r.sources || {}).forEach((d) => {
        const key = d.source || 'other';
        seen[key] = (seen[key] || 0) + (Number(d.usd) || 0);
      });
      let lines = Object.entries(seen).sort((a, b) => b[1] - a[1]);
      if (lines.some(([, amount]) => amount > 0)) lines = lines.filter(([, amount]) => amount > 0);
      lines.forEach(([name, amount], i) => {
        if (i) vendors.append(document.createTextNode('  '));
        const dot = el('span', 'dot');
        dot.style.background = 'var(--' + name + ', var(--ink-3))';
        vendors.append(dot, document.createTextNode((VENDOR_LABEL[name] || name) + ' ' + usd4(amount)));
      });
      tr.append(vendors);
      tbody.append(tr);
    });
    table.append(tbody);
    panel.append(table);

    const emptyNode = el('div', 'empty', 'No pipeline stages match these filters.');
    emptyNode.hidden = runs.length > 0;
    panel.append(emptyNode);
    holder.append(panel);

    const count = el('p', 'note');
    function apply() {
      let shown = 0;
      let sum = 0;
      Array.from(tbody.children).forEach((row, i) => {
        const r = runs[i];
        let ok = true;
        Object.entries(made).forEach(([key, ctrl]) => {
          const val = ctrl.sel.value;
          if (!val) return;
          if (key === 'from') { if ((r.run_date || '') < val) ok = false; }
          else if (key === 'to') { if ((r.run_date || '') > val) ok = false; }
          else if (ctrl.getValue) { if (ctrl.getValue(r) !== val) ok = false; }
          else if (r[key] !== val) ok = false;
        });
        row.hidden = !ok;
        if (ok) { shown += 1; sum += Number(r.total_usd) || 0; }
      });
      emptyNode.hidden = shown > 0;
      count.textContent = shown + ' of ' + runs.length + ' pipeline stages · ' + usd4(sum);
    }
    Object.values(made).forEach((ctrl) => ctrl.sel.addEventListener('change', apply));
    apply();
    return { node: holder, count: count };
  }

  function campaignListDate(c) {
    if (c.logged_at) return String(c.logged_at).slice(0, 10);
    const dates = runsOf((r) => r.campaign_id === c.campaign_id)
      .map((r) => r.run_date)
      .filter(Boolean)
      .sort();
    return dates.length ? dates[dates.length - 1] : '--';
  }

  /** One row per delivered list (campaign) — not per stage micro-run. */
  function listLedger(campaigns, opts) {
    opts = opts || {};
    const rows = (campaigns || []).slice().sort((a, b) => {
      const da = campaignListDate(a);
      const db = campaignListDate(b);
      if (da !== db) return db.localeCompare(da);
      return (b.usd_total || 0) - (a.usd_total || 0);
    });
    const holder = el('div');
    const controls = el('div', 'filters');
    const made = {};

    function makeSelect(key, label, values, getValue) {
      const vals = values || Array.from(new Set(rows.map((r) => (getValue ? getValue(r) : r[key])).filter(Boolean))).sort();
      if (vals.length < 2 && key !== 'campaign_type') return null;
      const wrap = el('label', null, label);
      const sel = document.createElement('select');
      sel.append(new Option('All', ''));
      vals.forEach((v) => sel.append(new Option(TYPE_LABEL[v] || String(v).replace(/_/g, ' '), v)));
      wrap.append(sel);
      controls.append(wrap);
      made[key] = { sel: sel, getValue: getValue || ((r) => r[key]) };
      return sel;
    }
    function makeDate(id, label) {
      const wrap = el('label', null, label);
      const input = document.createElement('input');
      input.type = 'date';
      wrap.append(input);
      controls.append(wrap);
      made[id] = { sel: input };
      return input;
    }

    if (opts.filters !== false) {
      makeSelect('client_id', 'Client');
      makeSelect('campaign_type', 'Type', ['company_outreach', 'talent_search'], campaignTypeOf);
      if (rows.length > 1) { makeDate('from', 'From'); makeDate('to', 'To'); }
      if (controls.children.length) holder.append(controls);
    }

    const panel = el('div', 'panel table-scroll');
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    ['Date', 'Client', 'Campaign / ICP', 'Type', 'Leads', 'USD', 'USD / lead', 'Vendors'].forEach((h) => {
      hr.append(el('th', (h === 'USD' || h === 'Leads' || h === 'USD / lead') ? 'r' : null, h));
    });
    thead.append(hr);
    table.append(thead);

    const tbody = document.createElement('tbody');
    rows.forEach((c) => {
      const tr = document.createElement('tr');
      tr.dataset.date = campaignListDate(c);
      tr.append(el('td', 'mono', tr.dataset.date));

      const co = document.createElement('td');
      if (c.client_id) {
        const link = el('a', null, c.client_name || c.client_id);
        link.href = '#/client/' + encodeURIComponent(c.client_id);
        co.append(link);
      } else {
        co.textContent = '—';
      }
      tr.append(co);

      const listCell = document.createElement('td');
      const label = c.display_name || c.campaign_id || '';
      const listLink = el('a', null, label);
      listLink.href = '#/campaign/' + encodeURIComponent(c.campaign_id || '');
      listLink.title = c.campaign_id || '';
      listCell.append(listLink);
      if (c.display_name && c.campaign_id && c.display_name !== c.campaign_id) {
        listCell.append(document.createElement('br'));
        listCell.append(el('span', 'mono', c.campaign_id));
      }
      const icp = c.icp || {};
      const titles = (icp.job_titles || []).slice(0, 2).join(' · ');
      if (titles) {
        listCell.append(document.createElement('br'));
        listCell.append(el('span', 'note', titles));
      }
      tr.append(listCell);

      const ctype = campaignTypeOf(c);
      tr.append(el('td', null, TYPE_LABEL[ctype] || ctype.replace(/_/g, ' ')));
      tr.append(el('td', 'r', int(c.delivered_leads)));
      tr.append(el('td', 'r', usd4(c.usd_total)));
      tr.append(el('td', 'r', c.per_lead_usd ? usd4(c.per_lead_usd) : '--'));

      const vendors = document.createElement('td');
      const src = c.by_source || {};
      let lines = Object.entries(src)
        .map(([name, d]) => [name, Number((d && d.usd) || 0)])
        .sort((a, b) => b[1] - a[1]);
      if (lines.some(([, amount]) => amount > 0)) lines = lines.filter(([, amount]) => amount > 0);
      if (!lines.length) {
        vendors.append(el('span', 'note', c.cost_basis === 'none' ? 'no cost data' : '—'));
      } else {
        lines.forEach(([name, amount], i) => {
          if (i) vendors.append(document.createTextNode('  '));
          const dot = el('span', 'dot');
          dot.style.background = 'var(--' + name + ', var(--ink-3))';
          vendors.append(dot, document.createTextNode((VENDOR_LABEL[name] || name) + ' ' + usd4(amount)));
        });
      }
      tr.append(vendors);
      tbody.append(tr);
    });
    table.append(tbody);
    panel.append(table);

    const emptyNode = el('div', 'empty', 'No campaigns match these filters.');
    emptyNode.hidden = rows.length > 0;
    panel.append(emptyNode);
    holder.append(panel);

    const count = el('p', 'note');
    function apply() {
      let shown = 0;
      let sum = 0;
      Array.from(tbody.children).forEach((row, i) => {
        const c = rows[i];
        let ok = true;
        Object.entries(made).forEach(([key, ctrl]) => {
          const val = ctrl.sel.value;
          if (!val) return;
          if (key === 'from') { if ((row.dataset.date || '') < val) ok = false; }
          else if (key === 'to') { if ((row.dataset.date || '') > val) ok = false; }
          else if (ctrl.getValue) { if (ctrl.getValue(c) !== val) ok = false; }
          else if (c[key] !== val) ok = false;
        });
        row.hidden = !ok;
        if (ok) { shown += 1; sum += Number(c.usd_total) || 0; }
      });
      emptyNode.hidden = shown > 0;
      count.textContent = shown + ' of ' + rows.length + ' campaigns · ' + usd4(sum);
    }
    Object.values(made).forEach((ctrl) => ctrl.sel.addEventListener('change', apply));
    apply();
    return { node: holder, count: count };
  }

  function appendFact(facts, label, value) {
    if (value === undefined || value === null || value === '' ||
        (Array.isArray(value) && !value.length)) return;
    facts.append(el('dt', null, label));
    if (Array.isArray(value)) {
      const dd = el('dd');
      const tags = el('div', 'tags');
      value.forEach((v) => tags.append(el('span', 'tag', String(v))));
      dd.append(tags);
      facts.append(dd);
    } else if (typeof value === 'object') {
      const dd = el('dd');
      const bits = Object.entries(value)
        .filter(([, v]) => v !== undefined && v !== null && v !== '')
        .map(([k, v]) => k.replace(/_/g, ' ') + ': ' + (Array.isArray(v) ? v.join(', ') : String(v)));
      dd.textContent = bits.join(' · ') || '—';
      facts.append(dd);
    } else {
      facts.append(el('dd', null, String(value)));
    }
  }

  async function loadLeadsPanel(campaignId, opts) {
    opts = opts || {};
    const panel = el('div', 'panel leads-preview');
    const viewMode = opts.view === 'full' ? 'full' : 'summary';
    const qs = new URLSearchParams();
    qs.set('preview', String(opts.preview != null ? opts.preview : 15));
    qs.set('view', viewMode);
    if (opts.runId) qs.set('run_id', opts.runId);
    try {
      const res = await fetch(
        '/dashboard/api/campaigns/' + encodeURIComponent(campaignId) + '/leads?' + qs.toString()
      );
      if (!res.ok) throw new Error('Failed to load leads');
      const data = await res.json();
      const noteBits = [
        int(data.total_rows) + ' row' + (data.total_rows === 1 ? '' : 's'),
        data.stage_file ? ('stage ' + data.stage_file) : null,
        data.view ? ('view ' + data.view) : null,
        data.run_id_filter ? ('run filter ' + data.run_id_filter) : null
      ].filter(Boolean);
      panel.append(el('p', 'note', noteBits.join(' · ')));
      if (data.note) panel.append(el('p', 'note', data.note));
      if (data.sheet_url) {
        const sheet = el('p', 'note');
        const a = el('a', null, 'Open Google Sheet');
        a.href = data.sheet_url;
        a.target = '_blank';
        a.rel = 'noopener';
        sheet.append(a);
        panel.append(sheet);
      }
      const rows = data.preview || [];
      if (!rows.length) {
        panel.append(el('div', 'empty', 'No leads on disk for this list yet.'));
      } else {
        const scroll = el('div', 'table-scroll' + (viewMode === 'full' ? ' wide-leads' : ''));
        scroll.append(leadsTable(rows, data.columns || (viewMode === 'full' ? null : LEAD_COLS)));
        panel.append(scroll);
        if (rows.length < (data.total_rows || 0)) {
          panel.append(el('p', 'note', 'Showing ' + rows.length + ' of ' + int(data.total_rows) + ' rows.'));
        }
      }
      panel.append(leadsActionBar(campaignId, Object.assign({}, opts, {
        csvLabel: 'Export full CSV'
      })));
    } catch (err) {
      panel.append(el('div', 'empty', 'No leads available to preview.'));
    }
    return panel;
  }

      'In progress & saved for later',
      'Gated runs and campaigns you deferred from Confirm. Open to resume seed+smoke or approve.',
      draftPanel
    ));

    fetch('/builder/api/campaigns')
      .then((r) => (r.ok ? r.json() : null))
      .then((payload) => {
        clear(draftPanel);
        const rows = ((payload && payload.campaigns) || []).filter((c) => {
          if ((c.client_id || '') !== clientId) return false;
          const phase = (c.list_run && c.list_run.phase) || 'idle';
          const build = c.list_build_status || '';
          return build === 'deferred'
            || ['seeding', 'matching', 'smoking', 'awaiting_approval', 'running_full', 'error']
              .indexOf(phase) >= 0;
        });
        if (!rows.length) {
          draftPanel.append(el('div', 'empty',
            'None right now. Use Save for later on Confirm, or start a gated run.'));
          return;
        }
        rows.forEach((c) => {
          const row = el('a', 'list-row');
          row.href = '/builder?campaign=' + encodeURIComponent(c.campaign_id);
          const id = el('div', 'id-cell');
          id.append(el('span', 'name', c.display_name || c.campaign_id));
          const meta = el('div', 'meta');
          meta.append(el('span', 'mono', c.campaign_id));
          const ctype = c.campaign_type || 'company_outreach';
          meta.append(el('span', 'ctype ' + (ctype === 'talent_search' ? 'ts' : 'co'),
            TYPE_LABEL[ctype] || outreachLabel(ctype)));
          const phase = (c.list_run && c.list_run.phase) || 'idle';
          const fake = {
            list_run_phase: phase,
            list_build_status: c.list_build_status || '',
          };
          const badge = listRunBadge(fake);
          if (badge) meta.append(el('span', badge.cls, badge.text));
          else if (c.list_build_status === 'deferred') {
            meta.append(el('span', 'ctype co', 'saved for later'));
          }
          id.append(meta);
          if (c.list_run && c.list_run.message) {
            id.append(el('div', 'bits', c.list_run.message));
          }
          row.append(id);
          const money = el('div', 'money');
          money.append(el('span', 'per', 'Open in builder →'));
          row.append(money);
          draftPanel.append(row);
        });
      })
      .catch(() => {
        clear(draftPanel);
        draftPanel.append(el('div', 'empty', 'Could not load saved campaigns.'));
      });

    const companyIcpPanel = el('div', 'panel icp-accordion');
    companyIcpPanel.append(el('div', 'empty', 'Loading ICPs…'));
    const talentIcpPanel = el('div', 'panel icp-accordion');
    talentIcpPanel.append(el('div', 'empty', 'Loading ITPs…'));

    view.append(section(
      'Company outreach — existing ICPs',
      'From data/clients/' + clientId + '/company_outreach/icps/ (legacy flat icps/ still listed).',
      companyIcpPanel
    ));
    view.append(section(
      'Talent outreach — existing ITPs',
      'From data/clients/' + clientId + '/talent_outreach/itps/.',
      talentIcpPanel
    ));

    function syncBuilderLinks() {
      selectedType = typeSelect.value || 'company_outreach';
      const noun = targetingLabel(selectedType);
      buildIcp.textContent = 'Build new ' + noun;
      buildIcp.href = '/builder?client=' + encodeURIComponent(clientId)
        + '&new=1&type=' + encodeURIComponent(selectedType);
      createList.href = '/builder?client=' + encodeURIComponent(clientId)
        + '&new=1&type=' + encodeURIComponent(selectedType);
      if (selectedIcp) {
        const row = (window.__clientIcps || []).find((x) => x.icp_id === selectedIcp);
        const campId = row && row.campaign_ids && row.campaign_ids[0];
        if (campId) {
          editPlan.href = '/builder?campaign=' + encodeURIComponent(campId);
          editPlan.hidden = false;
          editPlan.textContent = 'Edit enrichment';
        } else {
          editPlan.href = '/builder?client=' + encodeURIComponent(clientId)
            + '&new=1&icp=' + encodeURIComponent(selectedIcp);
          editPlan.hidden = false;
          editPlan.textContent = 'New campaign from ' + targetingLabel(
            (row && row.campaign_type) || selectedType);
        }
      } else {
        editPlan.hidden = true;
        editPlan.textContent = 'Edit enrichment';
      }
    }

    function closeIcpItem(node) {
      node.classList.remove('open');
      const h = node.querySelector('.icp-acc-head');
      if (h) h.setAttribute('aria-expanded', 'false');
      const b = node.querySelector('.icp-acc-body');
      if (b) b.remove();
    }

    function fillLibraryIcpBody(body, summary, fullIcp) {
      clear(body);
      const noun = targetingLabel(summary.campaign_type || 'company_outreach');
      const fakeCampaign = {
        campaign_id: (summary.campaign_ids && summary.campaign_ids[0]) || summary.icp_id,
        display_name: summary.display_name,
        campaign_type: summary.campaign_type,
        icp: fullIcp || summary.icp || {},
      };
      const facts = targetingFacts(fakeCampaign, {
        icp: fullIcp || summary.icp || {},
        campaignType: summary.campaign_type || 'company_outreach',
      });
      if (!facts.children.length) {
        body.append(el('div', 'empty', 'No ' + noun + ' details saved yet.'));
      } else {
        body.append(facts);
      }

      const linked = (summary.campaign_ids || [])
        .map((id) => campaignById(id) || { campaign_id: id, display_name: id })
        .filter(Boolean);
      body.append(associatedCampaignsList(linked));

      const disk = summary.disk_path
        || ('data/clients/' + clientId + '/'
          + (summary.campaign_type === 'talent_search'
            ? 'talent_outreach/itps/'
            : 'company_outreach/icps/')
          + summary.icp_id + '/');
      body.append(el('p', 'note', 'Library path: ' + disk));

      const genRow = el('div', 'icp-rename-actions');
      const genBody = el('a', 'btn primary', 'Generate campaign');
      const ctypeBody = summary.campaign_type || 'company_outreach';
      genBody.href = (window.PortalCreatePrefill
        ? window.PortalCreatePrefill.buildCampaignCreateUrl({
          clientId: clientId,
          icpId: summary.icp_id,
          campaignType: ctypeBody,
        })
        : ('/builder?client=' + encodeURIComponent(clientId)
          + '&new=1&type=' + encodeURIComponent(ctypeBody)
          + '&icp=' + encodeURIComponent(summary.icp_id)));
      if (summary.ready === false) {
        genBody.classList.add('disabled');
        genBody.href = '#';
        genBody.addEventListener('click', (e) => {
          e.preventDefault();
          alert('This ' + noun + ' is incomplete. Finish targeting fields first.');
        });
      }
      genRow.append(genBody);
      body.append(genRow);

      const renameRow = el('div', 'icp-rename');
      renameRow.append(el('label', null, noun + ' name'));
      const input = document.createElement('input');
      input.type = 'text';
      input.value = summary.display_name || summary.icp_id || '';
      input.placeholder = 'e.g. Headhunting US 1-50';
      renameRow.append(input);
      const actions = el('div', 'icp-rename-actions');
      const saveBtn = el('button', 'btn', 'Rename ' + noun);
      saveBtn.type = 'button';
      const status = el('span', 'savehint', '');
      saveBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const nameVal = (input.value || '').trim();
        if (!nameVal) {
          status.textContent = 'Name required';
          return;
        }
        status.textContent = 'Saving…';
        fetch('/builder/api/clients/' + encodeURIComponent(clientId)
          + '/icps/' + encodeURIComponent(summary.icp_id) + '/meta', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ display_name: nameVal }),
        })
          .then((r) => r.json().then((data) => ({ ok: r.ok, data })))
          .then(({ ok, data }) => {
            if (!ok) throw new Error((data && data.detail) || 'Rename failed');
            summary.display_name = nameVal;
            const titleCid = body.parentElement
              && body.parentElement.querySelector('.icp-acc-title .cid');
            if (titleCid) titleCid.textContent = nameVal;
            status.textContent = 'Saved';
          })
          .catch((err) => {
            status.textContent = err.message || 'Rename failed';
          });
      });
      actions.append(saveBtn, status);
      const delBtn = el('button', 'btn danger', 'Delete ' + noun);
      delBtn.type = 'button';
      delBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const linked = (summary.campaign_ids || []).length;
        const msg = linked
          ? ('Delete ' + noun + ' "' + (summary.display_name || summary.icp_id) + '"?\n'
            + linked + ' campaign(s) still reference it. Continue with force delete?')
          : ('Delete ' + noun + ' "' + (summary.display_name || summary.icp_id) + '"? This cannot be undone.');
        if (!window.confirm(msg)) return;
        status.textContent = 'Deleting…';
        const force = linked ? '1' : '0';
        fetch('/builder/api/clients/' + encodeURIComponent(clientId)
          + '/icps/' + encodeURIComponent(summary.icp_id) + '?force=' + force, {
          method: 'DELETE',
        })
          .then((r) => r.json().then((data) => ({ ok: r.ok, status: r.status, data })))
          .then(({ ok, data }) => {
            if (!ok) throw new Error((data && data.detail) || 'Delete failed');
            selectedIcp = '';
            syncBuilderLinks();
            fetch('/builder/api/clients/' + encodeURIComponent(clientId) + '/icps')
              .then((r) => (r.ok ? r.json() : null))
              .then((payload) => renderLibraryIcps((payload && payload.icps) || []))
              .catch(() => renderLibraryIcps([]));
          })
          .catch((err) => {
            status.textContent = err.message || 'Delete failed';
          });
      });
      actions.append(delBtn);
      renameRow.append(actions);
      body.append(renameRow);
    }

    function toggleLibraryIcp(summary, item, head, panel) {
      const id = summary.icp_id;
      const wasOpen = item.classList.contains('open');
      panel.querySelectorAll('.icp-acc-item').forEach(closeIcpItem);
      if (wasOpen) {
        selectedIcp = '';
        syncBuilderLinks();
        return;
      }
      item.classList.add('open');
      head.setAttribute('aria-expanded', 'true');
      selectedIcp = id;
      syncBuilderLinks();
      const body = el('div', 'icp-acc-body');
      body.append(el('div', 'empty', 'Loading ' + targetingLabel(summary.campaign_type) + '…'));
      item.append(body);
      fetch('/builder/api/clients/' + encodeURIComponent(clientId)
        + '/icps/' + encodeURIComponent(id))
        .then((r) => {
          if (!r.ok) throw new Error('ICP fetch failed');
          return r.json();
        })
        .then((payload) => {
          if (selectedIcp !== id || !item.classList.contains('open')) return;
          fillLibraryIcpBody(body, summary, payload.data || {});
        })
        .catch(() => {
          if (selectedIcp !== id || !item.classList.contains('open')) return;
          fillLibraryIcpBody(body, summary, summary.icp || {});
        });
    }

    function renderIcpRowsInto(panel, rows, emptyMsg) {
      clear(panel);
      if (!rows.length) {
        panel.append(el('div', 'empty', emptyMsg));
        return;
      }
      rows.forEach((summary) => {
        const item = el('div', 'icp-acc-item');
        item.dataset.id = summary.icp_id;

        const row = el('div', 'icp-acc-row');
        const head = el('button', 'icp-acc-head');
        head.type = 'button';
        head.setAttribute('aria-expanded', 'false');
        const headMain = el('div', 'icp-acc-main');
        const titleRow = el('div', 'icp-acc-title');
        const label = summary.display_name || summary.icp_id;
        titleRow.append(el('span', 'cid', label));
        titleRow.append(el('span', 'mono', summary.icp_id));
        const ctype = summary.campaign_type || 'company_outreach';
        titleRow.append(el('span', 'ctype ' + (ctype === 'talent_search' ? 'ts' : 'co'),
          TYPE_LABEL[ctype] || outreachLabel(ctype)));
        if (summary.ready === false) {
          titleRow.append(el('span', 'ctype ts', 'incomplete'));
        }
        const nCamp = (summary.campaign_ids || []).length;
        if (nCamp) {
          titleRow.append(el('span', 'note', nCamp === 1 ? '1 campaign' : (nCamp + ' campaigns')));
        }
        headMain.append(titleRow);
        const icp = summary.icp || {};
        const titles = (icp.job_titles || []).slice(0, 4).join(' · ') || '—';
        const geo = (icp.contact_locations || []).join(', ') || '—';
        const size = (icp.company_size_min || icp.company_size_max)
          ? ((icp.company_size_min || '?') + ' – ' + (icp.company_size_max || '?'))
          : '—';
        const bits = el('div', 'bits');
        bits.innerHTML = '<span>Titles:</span>' + titles
          + '  <span>Geo:</span>' + geo
          + '  <span>Size:</span>' + size;
        headMain.append(bits);
        if (summary.ready === false && summary.remedy) {
          headMain.append(el('p', 'note', summary.remedy));
        }
        head.append(headMain);
        head.append(el('span', 'icp-acc-chevron', '▾'));
        head.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          toggleLibraryIcp(summary, item, head, panel);
        });

        const gen = el('a', 'btn primary icp-gen-btn', 'Generate campaign');
        const ctypeForGen = summary.campaign_type || 'company_outreach';
        gen.href = (window.PortalCreatePrefill
          ? window.PortalCreatePrefill.buildCampaignCreateUrl({
            clientId: clientId,
            icpId: summary.icp_id,
            campaignType: ctypeForGen,
          })
          : ('/builder?client=' + encodeURIComponent(clientId)
            + '&new=1&type=' + encodeURIComponent(ctypeForGen)
            + '&icp=' + encodeURIComponent(summary.icp_id)));
        gen.title = summary.ready === false
          ? ('Finish this ' + targetingLabel(ctypeForGen) + ' before generating a campaign')
          : ('Create a new campaign from ' + (summary.display_name || summary.icp_id));
        if (summary.ready === false) {
          gen.classList.add('disabled');
          gen.setAttribute('aria-disabled', 'true');
          gen.addEventListener('click', (e) => {
            e.preventDefault();
            alert('This ' + targetingLabel(ctypeForGen)
              + ' is incomplete. Finish targeting fields first, then generate a campaign.');
          });
        }

        row.append(head);
        row.append(gen);
        item.append(row);
        panel.append(item);
      });
    }

    function renderLibraryIcps(rows) {
      window.__clientIcps = rows || [];
      const companyRows = (rows || []).filter((r) => (r.campaign_type || 'company_outreach') !== 'talent_search');
      const talentRows = (rows || []).filter((r) => r.campaign_type === 'talent_search');
      renderIcpRowsInto(
        companyIcpPanel,
        companyRows,
        'No ICPs in data/clients/' + clientId + '/company_outreach/icps/ yet. Use Build new ICP.'
      );
      renderIcpRowsInto(
        talentIcpPanel,
        talentRows,
        'No ITPs in data/clients/' + clientId + '/talent_outreach/itps/ yet. Use Build new ITP.'
      );
    }

    fetch('/builder/api/clients/' + encodeURIComponent(clientId) + '/icps')
      .then((r) => {
        if (!r.ok) throw new Error('Failed to load ICPs');
        return r.json();
      })
      .then((payload) => renderLibraryIcps(payload.icps || []))
      .catch(() => {
        clear(companyIcpPanel);
        clear(talentIcpPanel);
        companyIcpPanel.append(el('div', 'empty',
          'Could not load ICP library. Is the portal server running with /builder routes?'));
        talentIcpPanel.append(el('div', 'empty',
          'Could not load ITP library. Is the portal server running with /builder routes?'));
      });

    typeSelect.addEventListener('change', syncBuilderLinks);
    syncBuilderLinks();

    const name = (bucket && bucket.client_name) || (mine[0] && mine[0].client_name) || clientId;
    return {
      eyebrow: 'Client',
      title: name,
      sub: mine.length + (mine.length === 1 ? ' campaign' : ' campaigns') + ' under this client.',
      crumbs: [['Overview', '#/']],
      titleSuffix: clientId,
      clientId: clientId,
      headerActions: [
        {
          href: '/builder?client=' + encodeURIComponent(clientId) + '&new=1',
          label: 'Build new campaign',
          primary: true
        }
      ],
      view: view
    };
  }

  function viewCampaign(campaignId) {
    const c = campaignById(campaignId);
    if (!c) return null;

    const view = document.createDocumentFragment();
    const counts = c.lead_counts || {};
    const myRuns = runsOf((r) => r.campaign_id === campaignId);

    view.append(tiles([
      { label: 'Campaign spend', value: usd(c.usd_total), foot: myRuns.length + ' pipeline stages', lead: true },
      { label: 'Delivered leads', value: int(c.delivered_leads), foot: 'contactable rows on disk' },
      { label: 'Cost / lead', value: c.per_lead_usd ? usd4(c.per_lead_usd) : '--', foot: 'campaign spend / delivered' },
      { label: 'Seeds in', value: int(counts.seeds), foot: pct(c.delivered_leads, counts.seeds) + ' reached contactable' }
    ]));

    const gatePanel = el('div', 'panel');
    gatePanel.append(el('div', 'empty', 'Loading gated-run status…'));
    view.append(section(
      'Gated run / smoke',
      'Seed list and smoke results (smoke CSVs live under clients/{id}/smoke/runs/).',
      gatePanel
    ));
    fetch('/builder/api/campaigns/' + encodeURIComponent(campaignId) + '/run')
      .then((r) => (r.ok ? r.json() : null))
      .then((payload) => {
        clear(gatePanel);
        const lr = (payload && payload.list_run) || {};
        if (!lr.phase || lr.phase === 'idle') {
          gatePanel.append(el('div', 'empty',
            'No gated run yet. Start seed + smoke from the builder Confirm step.'));
          return;
        }
        const bits = el('div', 'bits');
        bits.appendChild(document.createTextNode(
          'Phase: ' + lr.phase
          + (lr.message ? (' · ' + lr.message) : '')
          + (lr.counts && lr.counts.seeds != null
            ? (' · ' + lr.counts.seeds + ' seeds') : '')
          + (lr.counts && lr.counts.smoke_seeds != null
            ? (' · smoked ' + lr.counts.smoke_seeds + ' companies') : '')
          + (lr.counts && lr.counts.smoke_contactable != null
            ? (' · ' + lr.counts.smoke_contactable + ' contactable') : '')
        ));
        gatePanel.append(bits);

        const seeds = lr.seed_preview || [];
        if (seeds.length) {
          gatePanel.append(el('h3', null,
            'Seed list (' + (lr.counts && lr.counts.seeds != null ? lr.counts.seeds : seeds.length) + ')'));
          const ul = el('ul', 'seed-list');
          seeds.slice(0, 25).forEach((s) => {
            ul.appendChild(el('li', null,
              (s.company_name || '')
              + (s.website ? (' — ' + s.website) : '')
              + (s.location ? (' · ' + s.location) : '')
            ));
          });
          if ((lr.counts && lr.counts.seeds > 25) || seeds.length >= 25) {
            ul.appendChild(el('li', 'note', '… see stages/01_raw_seeds.csv for full list'));
          }
          gatePanel.append(ul);
        }

        const smokeRows = lr.smoke_preview || [];
        if (smokeRows.length || lr.smoke_run_id || lr.phase === 'error') {
          gatePanel.append(el('h3', null, 'Smoke results'));
          if (smokeRows.length) {
            const sul = el('ul', 'seed-list');
            smokeRows.forEach((s) => {
              const email = s.decision_maker_email || '(no email)';
              sul.appendChild(el('li', null,
                (s.company_name || '')
                + ' — ' + (s.decision_maker_name || '')
                + (s.decision_maker_title ? (', ' + s.decision_maker_title) : '')
                + ' · ' + email
              ));
            });
            gatePanel.append(sul);
          } else if (lr.phase === 'error') {
            gatePanel.append(el('p', 'note',
              'Smoke did not finish writing a CSV (worker interrupted). See error below and the smoke log under clients/' + (c.client_id || '…') + '/smoke/runs/.'));
          }
          if (lr.smoke_csv_path || lr.smoke_run_id) {
            gatePanel.append(el('p', 'note',
              lr.smoke_csv_path
                ? ('CSV: ' + lr.smoke_csv_path)
                : ('Run ' + lr.smoke_run_id + ' under data/clients/' + (c.client_id || '…') + '/smoke/runs/')
            ));
          }
          if (lr.phase === 'awaiting_approval') {
            const approve = el('a', 'primary', 'Review & approve full batch in builder');
            approve.href = '/builder?campaign=' + encodeURIComponent(campaignId);
            approve.style.display = 'inline-block';
            approve.style.marginTop = '10px';
            gatePanel.append(approve);
          }
        }
        if (lr.error) {
          gatePanel.append(el('div', 'callout', lr.error));
        }
      })
      .catch(() => {
        clear(gatePanel);
        gatePanel.append(el('div', 'empty', 'Could not load gated-run status.'));
      });

    if (c.error) {
      const warn = el('div', 'panel');
      warn.append(el('div', 'callout',
        'Cost report failed to build for this list, so the totals above are incomplete: ' + c.error));
      view.append(warn);
    }

    const funnelPanel = el('div', 'panel');
    const top = Math.max.apply(null, STAGES.map(([k]) => counts[k] || 0).concat([1]));
    STAGES.forEach(([key, label]) => {
      const value = counts[key] || 0;
      const row = el('div', 'stage-row');
      row.append(el('div', 'stage-name', label));
      const track = el('div', 'track');
      const fill = el('div', 'fill');
      fill.style.width = (value / top * 100) + '%';
      track.append(fill);
      row.append(track);
      row.append(el('div', 'count', int(value)));
      row.append(el('div', 'pct', pct(value, counts.seeds)));
      funnelPanel.append(row);
    });
    view.append(section('Funnel', 'Share is measured against raw seeds in.', funnelPanel));

    const cols = el('div', 'cols');
    const vendorSec = el('div', 'section');
    vendorSec.append(el('h3', null, 'By vendor'));
    vendorSec.append(splitBar(c.by_source, true));
    vendorSec.append(vendorTable([c]));
    cols.append(vendorSec);

    const stepSec = el('div', 'section');
    stepSec.append(el('h3', null, 'By workflow step'));
    const stepPanel = el('div', 'panel table-scroll');
    const steps = c.by_workflow_step || {};
    if (Object.keys(steps).length) {
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const hr = document.createElement('tr');
      ['Step', 'Runs', 'USD', 'Share'].forEach((h, i) => hr.append(el('th', i ? 'r' : null, h)));
      thead.append(hr);
      table.append(thead);
      const tbody = document.createElement('tbody');
      const stepTotal = Object.values(steps).reduce((a, s) => a + (Number(s.usd) || 0), 0);
      Object.entries(steps).sort((a, b) => (b[1].usd || 0) - (a[1].usd || 0)).forEach(([name, s]) => {
        const tr = document.createElement('tr');
        tr.append(el('td', null, name.replace(/_/g, ' ')));
        tr.append(el('td', 'r', int(s.runs)));
        tr.append(el('td', 'r', usd4(s.usd)));
        tr.append(el('td', 'r', stepTotal ? ((s.usd || 0) / stepTotal * 100).toFixed(1) + '%' : '--'));
        tbody.append(tr);
      });
      table.append(tbody);
      stepPanel.append(table);
    } else {
      stepPanel.append(el('div', 'empty', 'Workflow-step attribution is only recorded for v4 manifests.'));
    }
    stepSec.append(stepPanel);
    cols.append(stepSec);
    view.append(section('Cost breakdown', null, cols));

    const targetHolder = el('div');
    targetHolder.append(targetingAndModulesPanel(c));
    view.append(section('Targeting and billing basis', 'ICP rules, then enrichment modules planned for this list.', targetHolder));
    fetch('/builder/api/campaigns/' + encodeURIComponent(campaignId))
      .then((r) => (r.ok ? r.json() : null))
      .then((data) => {
        if (!data || !data.plan) return;
        c.plan = data.plan;
        clear(targetHolder);
        targetHolder.append(targetingAndModulesPanel(c));
      })
      .catch(() => { /* keep index snapshot */ });

    mountLeadsSection(
      view,
      'Generated leads',
      'Summary columns for a quick scan. Open Full results for the wide field set, or Export CSV / Google Sheet.',
      campaignId,
      { preview: 15, showFull: true, view: 'summary' }
    );

    const runPanel = el('div', 'panel');
    if (!myRuns.length) {
      runPanel.append(el('div', 'empty', 'No pipeline stages logged for this campaign.'));
    }
    myRuns.forEach((r) => runPanel.append(runCard(r, campaignId, true)));
    view.append(section('Pipeline stages', 'Stage-level spend (seeding, Apollo, enrichment, repair). The campaign as a whole is one generated list on the ledger.', runPanel));

    const crumbs = [['All clients', '#/']];
    if (c.client_id) crumbs.push([c.client_name || c.client_id, '#/client/' + encodeURIComponent(c.client_id)]);
    return {
      eyebrow: 'Campaign',
      title: c.display_name || c.campaign_id,
      sub: (c.client_name ? 'Built for ' + c.client_name + '. ' : '')
         + (c.display_name && c.display_name !== c.campaign_id ? ('Folder ' + c.campaign_id + '. ') : '')
         + int(counts.seeds) + ' seeds in, ' + int(c.delivered_leads) + ' contactable leads out.',
      crumbs: crumbs,
      campaignId: campaignId,
      headerActions: [
        {
          href: '/builder?campaign=' + encodeURIComponent(campaignId),
          label: 'Edit enrichment',
          primary: true
        }
      ],
      view: view
    };
  }

  function viewRun(campaignId, runKey) {
    const c = campaignById(campaignId);
    const r = findRun(campaignId, runKey);
    if (!c || !r) return null;

    const view = document.createDocumentFragment();
    view.append(tiles([
      { label: 'Stage spend', value: usd4(r.total_usd), foot: (r.workflow_step || '').replace(/_/g, ' ') || 'pipeline stage', lead: true },
      { label: 'Campaign delivered', value: int(c.delivered_leads), foot: 'contactable on campaign' },
      { label: 'Campaign spend', value: usd(c.usd_total), foot: 'all stages for this campaign' },
      { label: 'Cost / lead', value: c.per_lead_usd ? usd4(c.per_lead_usd) : '--', foot: 'campaign blended' }
    ]));

    const costPanel = el('div', 'panel');
    costPanel.append(runCard(r, campaignId, false));
    view.append(section('Cost breakdown', 'Sources, Apify actors, and outcome for this pipeline stage.', costPanel));

    const facts = targetingFacts(c);
    if (facts.children.length) {
      const panel = el('div', 'panel');
      panel.append(facts);
      view.append(section('Targeting', null, panel));
    }

    const runFilter = r.pipeline_run_id || r.run_key || runKey;
    mountLeadsSection(
      view,
      'Generated leads',
      'Filtered to this pipeline stage when rows carry a matching run_id.',
      campaignId,
      {
        preview: 15,
        runId: runFilter,
        showFull: true,
        fullHref: '#/campaign/' + encodeURIComponent(campaignId) + '/leads'
      }
    );

    const crumbs = [['All clients', '#/']];
    if (c.client_id) crumbs.push([c.client_name || c.client_id, '#/client/' + encodeURIComponent(c.client_id)]);
    crumbs.push([c.campaign_id, '#/campaign/' + encodeURIComponent(campaignId)]);
    return {
      eyebrow: 'Pipeline stage',
      title: r.label || r.run_key || runKey,
      sub: (r.run_date || '') + (r.pipeline_run_id ? (' · ' + r.pipeline_run_id) : ''),
      crumbs: crumbs,
      titleSuffix: runKeyOf(r) || runKey,
      campaignId: campaignId,
      headerActions: [
        {
          href: '/builder?campaign=' + encodeURIComponent(campaignId),
          label: 'Re-run list build',
          primary: true
        }
      ],
      view: view
    };
  }

  function viewLeads(campaignId) {
    const c = campaignById(campaignId);
    if (!c) return null;

    const view = document.createDocumentFragment();
    mountLeadsSection(
      view,
      'Full results',
      'Wide field set (up to 200 rows). Use Export CSV for every column on disk.',
      campaignId,
      {
        preview: 200,
        showFull: false,
        view: 'full',
        backHref: '#/campaign/' + encodeURIComponent(campaignId),
        backLabel: 'Back to campaign'
      }
    );

    const crumbs = [['All clients', '#/']];
    if (c.client_id) crumbs.push([c.client_name || c.client_id, '#/client/' + encodeURIComponent(c.client_id)]);
    crumbs.push([c.campaign_id, '#/campaign/' + encodeURIComponent(campaignId)]);
    return {
      eyebrow: 'Generated leads',
      title: c.campaign_id + ' · leads',
      sub: int(c.delivered_leads) + ' contactable leads on disk for this campaign.',
      crumbs: crumbs,
      titleSuffix: 'leads',
      campaignId: campaignId,
      headerActions: [
        {
          href: '/dashboard/api/campaigns/' + encodeURIComponent(campaignId) + '/leads.csv',
          label: 'Export CSV',
          primary: true
        }
      ],
      view: view
    };
  }

  /* ---------------- router ---------------- */

  const viewNode = document.getElementById('view');
  const crumbNode = document.getElementById('crumbs');

  let route = { kind: 'all', id: null };

  function parseHash(hash) {
    const h = hash || '';
    if (h === '#/new-client' || h === '#new-client') return { kind: 'new-client', id: null };
    let m = h.match(/^#\/campaign\/([^/]+)\/run\/(.+)$/);
    if (m) {
      return {
        kind: 'run',
        id: decodeURIComponent(m[1]),
        runKey: decodeURIComponent(m[2])
      };
    }
    m = h.match(/^#\/campaign\/([^/]+)\/leads\/?$/);
    if (m) return { kind: 'leads', id: decodeURIComponent(m[1]) };
    m = h.match(/^#\/(client|campaign)\/(.+)$/);
    if (!m) return { kind: 'all', id: null };
    return { kind: m[1], id: decodeURIComponent(m[2]) };
  }

  function routeResolves(r) {
    if (r.kind === 'new-client') return true;
    if (r.kind === 'client') return !!(clientById(r.id) || campaignsOfClient(r.id).length);
    if (r.kind === 'campaign' || r.kind === 'leads') return !!campaignById(r.id);
    if (r.kind === 'run') return !!(campaignById(r.id) && findRun(r.id, r.runKey));
    return true;
  }

  function resolve() {
    if (route.kind === 'new-client') return viewNewClient();
    if (route.kind === 'client') {
      const page = viewClient(route.id);
      if (page) return page;
    } else if (route.kind === 'campaign') {
      const page = viewCampaign(route.id);
      if (page) return page;
    } else if (route.kind === 'run') {
      const page = viewRun(route.id, route.runKey);
      if (page) return page;
    } else if (route.kind === 'leads') {
      const page = viewLeads(route.id);
      if (page) return page;
    }
    return viewOverview();
  }

  function navigate(next, fromHash) {
    route = next;
    if (!fromHash) {
      let target = '#/';
      if (next.kind === 'new-client') {
        target = '#/new-client';
      } else if (next.kind === 'client') {
        target = '#/client/' + encodeURIComponent(next.id);
      } else if (next.kind === 'campaign') {
        target = '#/campaign/' + encodeURIComponent(next.id);
      } else if (next.kind === 'run') {
        target = '#/campaign/' + encodeURIComponent(next.id)
          + '/run/' + encodeURIComponent(next.runKey);
      } else if (next.kind === 'leads') {
        target = '#/campaign/' + encodeURIComponent(next.id) + '/leads';
      }
      try {
        if (location.hash !== target) history.pushState(null, '', target);
      } catch (e) { /* ignore */ }
    }
    render();
  }

  document.addEventListener('click', function (e) {
    const link = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
    if (!link) return;
    e.preventDefault();
    const next = parseHash(link.getAttribute('href'));
    if (routeResolves(next)) navigate(next, false);
  });

  function render() {
    const page = resolve();
    clear(viewNode);
    clear(crumbNode);

    const crumbs = (page.crumbs || []).filter((crumb) => routeResolves(parseHash(crumb[1])));
    crumbs.forEach((crumb, i) => {
      if (i) crumbNode.append(el('span', 'sep', '/'));
      const link = el('a', null, crumb[0]);
      link.href = crumb[1];
      crumbNode.append(link);
    });
    if (crumbs.length) {
      crumbNode.append(el('span', 'sep', '/'));
      crumbNode.append(el('span', 'here', page.titleSuffix || page.title));
    }

    document.getElementById('eyebrow').textContent = page.eyebrow;
    document.getElementById('page-title').textContent = page.title;
    document.getElementById('page-sub').textContent = page.sub;
    document.title = page.title === 'Lead List Ledger' ? 'Lead List Ledger' : page.title + ' — Lead List Ledger';

    const actions = document.getElementById('header-actions');
    clear(actions);
    (page.headerActions || []).forEach((a) => {
      const link = el('a', a.primary ? 'primary' : null, a.label);
      link.href = a.href;
      actions.append(link);
    });
    const brand = document.getElementById('brand-mark');
    if (brand) brand.hidden = !page.showBrand;

    viewNode.append(page.view);
    window.scrollTo(0, 0);
  }

  function parseEmbedded() {
    const raw = (document.getElementById('ledger-data') || {}).textContent || '';
    const trimmed = raw.trim();
    if (!trimmed || trimmed === '__DATA__' || trimmed === '{}') return null;
    try {
      const parsed = JSON.parse(trimmed);
      if (!parsed || typeof parsed !== 'object') return null;
      if (!Object.keys(parsed).length) return null;
      return parsed;
    } catch (e) {
      return null;
    }
  }

  function boot(index) {
    DATA = index || DATA;
    if (!DATA.scope) DATA.scope = { kind: 'all', id: null };
    route = parseHash(location.hash);
    try {
      render();
      document.getElementById('stamp').textContent =
        'Generated ' + (DATA.logged_at || '') + ' · schema v' + (DATA.schema_version || '');
    } catch (err) {
      document.getElementById('page-title').textContent = 'Lead List Ledger';
      document.getElementById('page-sub').textContent =
        'Dashboard render failed: ' + (err && err.message ? err.message : String(err));
      console.error(err);
    }
  }

  window.addEventListener('hashchange', function () {
    const next = parseHash(location.hash);
    if (routeResolves(next)) navigate(next, true);
  });

  const embedded = parseEmbedded();
  if (embedded) {
    boot(embedded);
  } else {
    document.getElementById('page-title').textContent = 'Lead List Ledger';
    document.getElementById('page-sub').textContent = 'Loading ledger…';
    // Prefer cached index for fast paint. Pass ?refresh=1 on the URL to force rebuild.
    const apiUrl = (new URLSearchParams(location.search).get('refresh') === '1')
      ? '/dashboard/api?refresh=1'
      : '/dashboard/api';
    fetch(apiUrl)
      .then((r) => {
        if (!r.ok) throw new Error('Failed to load /dashboard/api');
        return r.json();
      })
      .then(boot)
      .catch((err) => {
        document.getElementById('page-title').textContent = 'Lead List Ledger';
        document.getElementById('page-sub').textContent = err.message
          + ' — run python scripts/build_cost_dashboard.py then retry.';
        document.getElementById('stamp').textContent = '';
      });
  }
})();
</script>
</body>
</html>
